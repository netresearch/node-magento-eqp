name: 📖 Documentation

on:
    workflow_dispatch:
    push:
        branches: [main]

# Allow one concurrent deployment
concurrency:
    group: 'pages'
    cancel-in-progress: true

jobs:
    build:
        name: 📖 Build docs
        uses: netresearch/.github/.github/workflows/pages-build.yml@main
        permissions:
            contents: read
        with:
            setup-node: true
            node-version: '24'
            setup-bun: true
            artifact-path: docs
            pre-build-command: HUSKY=0 bun install --frozen-lockfile
            build-command: bun run build:docs

    deploy:
        name: 📦🚀 Deploy
        needs: build
        uses: netresearch/.github/.github/workflows/pages-deploy.yml@main
        permissions:
            pages: write
            id-token: write
            contents: read
